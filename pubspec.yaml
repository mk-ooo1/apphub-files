name: money_manage_app
description: Personal & business money management — track gave/got, profit/loss, reminders, WhatsApp receipts.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0

  # Local notifications (reminders)
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

  # Receipt generation & sharing
  screenshot: ^3.0.0
  path_provider: ^2.1.4
  share_plus: ^12.0.2
  pdf: ^3.13.1
  printing: ^5.15.1

  # UI / utils
  intl: ^0.20.3
  fl_chart: ^1.3.0
  uuid: ^4.5.1
  google_fonts: ^9.0.0
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
