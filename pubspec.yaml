name: money_manage_app
description: Personal & business money management — track gave/got, profit/loss, reminders, WhatsApp receipts.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  # Local notifications (reminders)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Receipt generation & sharing
  screenshot: ^3.0.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  pdf: ^3.11.1
  printing: ^5.13.3

  # UI / utils
  intl: ^0.20.2
  fl_chart: ^0.69.0
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.5
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
